name: Deploy Universe Public Portal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Hub
        uses: actions/checkout@v4

      - name: Deploy Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
